# Lab GPU server sshd hardening.
# Tailscale SSH is the primary access path; Linux sshd is a fallback only.
# Installed to /etc/ssh/sshd_config.d/00-lab.conf by scripts/setup.sh.
# sshd keeps the first value it reads for each keyword and reads the drop-ins
# in lexical order, so the 00- prefix makes these win over 50-cloud-init.conf.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
