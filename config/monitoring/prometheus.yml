global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: dcgm
    static_configs:
      - targets: ['dcgm-exporter:9400']

  - job_name: node
    static_configs:
      # node-exporter runs in host network mode
      - targets: ['host.docker.internal:9100']
    # On Linux, host.docker.internal needs an explicit add-host (compose v2):
    # alternative: use the host's tailscale IP, or set extra_hosts.
