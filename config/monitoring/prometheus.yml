global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: dcgm
    static_configs:
      # reached over the compose network; no host port is published
      - targets: ['dcgm-exporter:9400']

  - job_name: node
    static_configs:
      # node-exporter runs in host network mode
      - targets: ['host.docker.internal:9100']
    # host.docker.internal resolves to the host via the prometheus service's
    # extra_hosts (host-gateway) entry in docker-compose.yml.
